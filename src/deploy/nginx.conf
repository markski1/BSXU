# Put these zones in nginx's http context.
limit_req_zone $binary_remote_addr zone=bsxu_public:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=bsxu_upload:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=bsxu_connections:10m;

server {
    listen 443 ssl;
    server_name files.example.com;
    ssl_certificate /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;

    client_max_body_size 129m;
    client_body_timeout 30s;
    keepalive_timeout 15s;
    limit_conn bsxu_connections 8;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_request_buffering off;

    location = /_bsxu-upload-auth {
        internal;
        proxy_pass http://127.0.0.1:5000/upload-auth;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Content-Type "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Upload-Key $http_x_upload_key;
    }
    location = /upload {
        limit_req zone=bsxu_upload burst=1 nodelay;
        auth_request /_bsxu-upload-auth;
        auth_request_set $bsxu_auth_status $upstream_status;
        auth_request_set $bsxu_auth_retry_after $upstream_http_retry_after;
        error_page 500 = @bsxu_upload_auth_error;
        proxy_pass http://127.0.0.1:5000;
    }
    location = /upload-auth { return 404; }
    location = /_bsxu-panel-upload-auth {
        internal;
        proxy_pass http://127.0.0.1:5000/panel/upload-auth;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Content-Type "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
    }
    location = /panel/upload-auth { return 404; }
    location = /panel/file-upload {
        limit_req zone=bsxu_upload burst=1 nodelay;
        auth_request /_bsxu-panel-upload-auth;
        auth_request_set $bsxu_auth_status $upstream_status;
        auth_request_set $bsxu_auth_retry_after $upstream_http_retry_after;
        error_page 500 = @bsxu_upload_auth_error;
        proxy_pass http://127.0.0.1:5000;
    }
    location @bsxu_upload_auth_error {
        add_header Retry-After $bsxu_auth_retry_after always;
        if ($bsxu_auth_status = 429) {
            return 429;
        }
        return 500;
    }
    location /panel/ {
        limit_req zone=bsxu_public burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
    }
    location / {
        limit_req zone=bsxu_public burst=20 nodelay;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:5000;
    }
}
