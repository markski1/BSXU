[project]
name = "bsxu"
version = "0.1.0"
description = "B2 ShareX uploader"
requires-python = ">=3.10"
dependencies = [
    "b2sdk",
    "flask",
    "flask-login",
    "gunicorn; sys_platform != 'win32'",
    "pillow",
    "pyperclip",
    "python-dotenv",
    "requests",
    "werkzeug",
]

[tool.uv]
package = false
exclude-newer = "5 days"
