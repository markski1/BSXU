[project]
name = "bsxu"
version = "0.1.0"
description = "B2 ShareX uploader"
requires-python = ">=3.11"
dependencies = [
    "b2sdk",
    "flask",
    "flask-login",
    "gunicorn; sys_platform != 'win32'",
    "pillow>=13.0.0",
    "certifi>=2026.10.19",
    "urllib3>=2.8.0",
    "python-dotenv",
    "requests",
    "werkzeug>=3.1.9",
]

[tool.uv]
package = false
exclude-newer = "5 days"
exclude-newer-package = { pillow = "24 hours", certifi = "24 hours", urllib3 = "24 hours", werkzeug = "24 hours" }

[dependency-groups]
flameshot = ["requests>=2.34.2", "certifi>=2026.10.19", "urllib3>=2.8.0", "pyperclip==1.11.0"]
