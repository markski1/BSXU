name: Checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.3"
          enable-cache: false
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
          firewall-version: "v1.15.4"
      - name: Install exact dependencies
        working-directory: src
        run: sfw uv sync --locked --no-dev --python ${{ matrix.python }}
      - name: Regression tests
        working-directory: src
        run: sfw uv run --locked --no-sync python -m unittest discover -s tests -v
      - name: Audit pinned dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        working-directory: src
        run: sfw uv run --locked --no-sync python tools/audit_dependencies.py
